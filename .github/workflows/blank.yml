
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _project
          mapfile -t archives < <(find . -maxdepth 1 -type f -iname '*.zip' -print)

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "В корне должен находиться ровно один ZIP"
            exit 1
          fi

          unzip -q "${archives[0]}" -d _project
          PROJECT_DIR="$(find _project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Файл settings.gradle не найден"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2000-yardov-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

